# ShopWise support inbox — the fixture every session reads.
#
# ONE copy for the whole course (PROJECT-SPINE §8). Session folders read
# ../data/tickets.yml; they never keep their own copy.
#
# Customer emails, order IDs and SKUs match PROJECT-SPINE §2 exactly, so a
# ticket that mentions ORD-5004 really is the order outside the return window.
# Nothing here is real: these are invented tickets for a fictional store.
#
# Fields
#   id        TCK-0NN, stable — exercises and solutions refer to these
#   subject   what the customer put in the subject line
#   body      the message, verbatim including bad grammar and shouting
#   from      customer email (the key into CUSTOMERS)
#   category  ground truth, hand-labelled — the S01 exercise counts these,
#             and from S03 the model has to predict them
#   received  ISO date, deliberately QUOTED so YAML keeps it a string. Unquoted,
#             pyyaml turns it into a datetime.date, and json.dumps then refuses
#             to serialize it — a real trap, met in warmup.py's JSON round trip.

